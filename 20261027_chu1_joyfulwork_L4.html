function derivedChoices(q){if(q.kind==='order'){let words=q.answer.match(/(?:[A-Za-z]+(?:-[A-Za-z]+)*|\d+|[.?!,])/g)||[];let alternatives=shuffle([q.answer,shuffle(words).join(' ').replace(/\s+([?.!,])/g,'$1'),words.slice().reverse().join(' ').replace(/\s+([?.!,])/g,'$1'),words.slice(1).concat(words[0]).join(' ').replace(/\s+([?.!,])/g,'$1')]);return [...new Set(alternatives)].slice(0,4)}let pool=QUESTIONS.filter(v=>v.kind===q.kind&&v.id!==q.id).map(x=>x.answer);let hard=q.kind==='verb'?['go','went','see','saw','eat','ate','enjoy','enjoyed','want','to play','Where','watch','listen','would like','to']:[];return shuffle([q.answer,...shuffle([...new Set([...hard,...pool])].filter(x=>norm(x)!==norm(q.answer))).slice(0,3)])}
function stats(){let n=Object.keys(records()).filter(k=>records()[k]===true).length;$('stats').textContent=`収録 ${QUESTIONS.length}問 ／ この名前の習得済み ${n}問`}
function start(override){name=$('name').value.trim()||'ゲスト';mode=$('mode').value;let k=$('kind').value,c=$('count').value;let pool=override||QUESTIONS.filter(q=>(k==='all'||q.kind===k)&& (c!=='unlearned'||!records()[q.id]));if($('random').checked)pool=shuffle(pool);session=(c==='10'&&!override?pool.slice(0,10):c==='20'&&!override?pool.slice(0,20):pool);if(!session.length){alert('出題対象がありません。カテゴリ・習得状況を確認してください。');return}answers=[];pos=0;$('setup').classList.add('hidden');$('results').classList.add('hidden');$('play').classList.remove('hidden');render()}
function render(){let q=session[pos];if(!q){finish();return}$('counter').textContent=`${pos+1} / ${session.length} 問`;$('category').textContent=label[q.kind];$('bar').style.width=`${100*pos/session.length}%`;$('question').textContent=q.prompt;$('jp').textContent=q.jp&&q.kind==='verb'?q.jp:'';$('message').textContent='';$('inputArea').innerHTML='';chosen='';tileSelected=[];let area=$('inputArea');if(mode==='write'){let x=document.createElement(q.kind==='order'?'textarea':'input');x.id='response';x.placeholder=q.kind==='order'?'英文を語順どおりに書いてください（例：I went to ... .）':'答えを入力';if(q.kind==='order'){x.rows=3}area.append(x);return}
if(q.kind==='order'){let words=q.answer.match(/(?:[A-Za-z]+(?:-[A-Za-z]+)*|\d+|[.?!,])/g)||[];tiles=shuffle(words.map((t,i)=>({t,i})));let out=document.createElement('div');out.id='tokens';area.append(out);let box=document.createElement('div');area.append(box);function draw(){out.innerHTML='';tileSelected.forEach((t,j)=>{let b=document.createElement('button');b.className='word';b.textContent=t.t;b.onclick=()=>{tileSelected.splice(j,1);draw()};out.append(b)});box.innerHTML='';tiles.filter(t=>!tileSelected.includes(t)).forEach(t=>{let b=document.createElement('button');b.className='word';b.textContent=t.t;b.onclick=()=>{tileSelected.push(t);draw()};box.append(b)});}draw();return}
let options=derivedChoices(q);if(q.kind==='v_en_jp'||q.kind==='v_jp_en'){options=[...new Set(options)];}options.forEach(v=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>{chosen=v;area.querySelectorAll('.opt').forEach(el=>el.classList.remove('selected'));b.classList.add('selected')};area.append(b)})}
function currentAnswer(){let q=session[pos];if(mode==='write')return $('response').value.trim();if(q.kind==='order')return tileSelected.map(v=>v.t).join(' ').replace(/\s+([.,?!])/g,'$1');return chosen}
function next(){let q=session[pos],a=currentAnswer();if(!a){$('message').textContent='答えを入力・選択してください。';return}answers.push({q,a,correct:equal(q,a)});pos++;if(pos>=session.length)finish();else render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function finish(){if(!$('play').classList.contains('hidden')&&pos<session.length){if(answers.length===0&&!confirm('まだ解答を記録していません。終了しますか？'))return}let r=records();wrongRecent=[];answers.forEach(({q,correct})=>{r[q.id]=correct;if(!correct)wrongRecent.push(q)});persist(r);$('play').classList.add('hidden');$('results').classList.remove('hidden');let ok=answers.filter(a=>a.correct).length;$('score').textContent=`${name}さん： ${answers.length}問中 ${ok}問正解 ／ 正答率 ${answers.length?Math.round(ok*100/answers.length):0}%`;$('reviews').innerHTML=answers.map(({q,a,correct},i)=>`<div class="result"><div><b class="${correct?'right':'wrong'}">${correct?'○':'×'} 第${i+1}問</b> <span class="tag">${label[q.kind]}</span></div><div>${esc(q.prompt)}</div><div>あなたの答え：<b>${esc(a)}</b></div><div class="right">正解：<b>${esc(q.answer)}</b></div></div>`).join('')||'<p>採点する回答がありません。</p>';$('missed').disabled=!wrongRecent.length;stats();window.scrollTo(0,0)}
$('start').onclick=()=>start();$('next').onclick=next;$('finish').onclick=finish;$('again').onclick=()=>{$('results').classList.add('hidden');$('setup').classList.remove('hidden');stats();window.scrollTo(0,0)};$('missed').onclick=()=>start(wrongRecent);$('reset').onclick=()=>{let n=$('name').value.trim()||'ゲスト';if(confirm(n+' さんの習得記録をリセットしますか？')){localStorage.removeItem('lesson4-master-v1:'+n);stats()}};$('name').oninput=stats;$('name').value=localStorage.getItem('lesson4-lastname')||'';$('start').addEventListener('click',()=>{try{localStorage.setItem('lesson4-lastname',name)}catch{}});stats();</script></body></html>
